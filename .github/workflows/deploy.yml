name: Deploy Website

on:
  push:
    branches: [main]
    paths: ["web/**", "lexicons/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: ./web/package.json

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Download wisp CLI
        run: |
          curl -fsSL https://sites.wisp.place/nekomimi.pet/wisp-cli-binaries/wisp-cli-x86_64-linux -o wisp-cli
          chmod +x wisp-cli

      - name: Deploy to wisp.place
        run: |
          ./wisp-cli \
            "$WISP_HANDLE" \
            --path "./build" \
            --site "$SITE_NAME" \
            --password "$WISP_APP_PASSWORD"
        env:
          SITE_NAME: sts2.byjp.me
          WISP_HANDLE: ${{ vars.WISP_HANDLE }}
          WISP_APP_PASSWORD: ${{ secrets.WISP_APP_PASSWORD }}
